[project]
name = "pricegetter-redis"
version = "0.1.0"
description = "EVE Online market loader that fetches ESI orders and publishes aggregates straight to Redis, no SQL database required."
authors = [
    { name = "Steve Ronuken", email = "steve@fuzzysteve.co.uk" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "requests-futures>=1.1.0",
]

[tool.uv]
package = false
